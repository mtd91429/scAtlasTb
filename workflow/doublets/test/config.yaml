output_dir: test/out
images: test/images

use_gpu: false

DATASETS:
  Lee2020:
    input:
      doublets: 
        Lee2020: test/input/load_data/harmonize_metadata/Lee2020.zarr
    doublets:
      counts: X
      batch: donor_id
      chunk_size: 10_000
  
  test:
    input:
      doublets:
        test: test/input/pbmc68k.h5ad
        test2: test/input/pbmc68k.h5ad
    doublets:
      counts: layers/counts
      methods:
        - scrublet
        - doubletdetection
        - scdblfinder

  test_scdblfinder:
    input:
      doublets:
        test: test/input/pbmc68k.h5ad
    doublets:
      counts: layers/counts
      methods:
        scrublet:
        scdblfinder:
          seed: 1
          dbr.per1k: 0.008  # scDblFinder() argument under its R name: expected doublet rate per 1,000 cells


defaults:
  datasets:
    - test
    - test_scdblfinder
    - Lee2020