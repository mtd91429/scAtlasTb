name: scvi-tools
channels:
  - conda-forge
dependencies:
  - python=3.11
  - anndata=0.11
  - scanpy=1.11
  - zarr<3
  - pandas<3
  - scipy<1.15
  - dask
  - sparse
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu130
    - torch>=2.5
    - jax[cuda13]
    - scvi-tools>=1.3.0
    - faiss-cpu<=1.9
    - patpy
    - drvi-py
