name: rapids_singlecell
channels:
  - conda-forge
dependencies:
  - python=3.11
  - anndata=0.11
  - scanpy=1.11
  - leidenalg
  - louvain
  - zarr
  - dask
  - dask-ml
  - pandas<3
  - scipy<1.15
  - scikit-learn<1.6  # required by dask-ml
  - harmonypy<0.1.0   # >=0.1.0 breaks scanpy.external.pp.harmony_integrate (scanpy issue #3940)
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu130
    - --extra-index-url https://pypi.nvidia.com
    - torch>=2.5
    - rapids-singlecell-cu13[rapids]
    - harmony-pytorch
